<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Dashboard | FarmDirect</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="logo">🌾 <span>FarmDirect</span></a>
      </div>
      
      <div class="user-profile">
        <div class="avatar" id="userAvatar">👨‍🌾</div>
        <div class="user-info">
          <h3 id="userName">Farmer</h3>
          <span class="role-badge" id="userRoleBadge">Farmer</span>
        </div>
      </div>
      
      <nav class="sidebar-nav" id="sidebarNav">
        <a href="#" class="nav-item active" onclick="switchTab('dashboard', this)">🏠 Dashboard</a>
        <a href="#" class="nav-item" onclick="switchTab('sell', this)">🌾 Sell Your Crop</a>
        <a href="#" class="nav-item" onclick="switchTab('notifications', this)">🔔 Notifications</a>
      </nav>

      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">Log Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="header-left">
          <h2 id="pageTitle">Dashboard</h2>
        </div>
      </header>

      <div class="dashboard-content" id="dashboardContent">
        
        <!-- DASHBOARD TAB -->
        <div id="tab-dashboard" class="tab-content">
          <div id="myCropsContainer">
            <h2 class="section-title">🌾 My Active Listings</h2>
            <div class="matches-grid" id="myCropsGrid">Loading crops...</div>
          </div>
        </div>

        <!-- SELL CROP TAB -->
        <div id="tab-sell" class="tab-content" style="display: none;">
          <div class="form-card">
            <h2 class="section-title">🌾 Sell Your Crop</h2>
            <form id="sellCropForm">
              <div class="form-grid">
                <div class="input-group">
                  <label for="cropName">Crop Name</label>
                  <input type="text" id="cropName" placeholder="e.g. Tomato" required>
                </div>
                <div class="input-group">
                  <label for="cropQuantity">Quantity in KG</label>
                  <input type="number" id="cropQuantity" required>
                </div>
                <div class="input-group">
                  <label for="cropPrice">Price Per KG (₹)</label>
                  <input type="number" id="cropPrice" required>
                </div>
                <div class="input-group">
                  <label for="cropQuality">Quality</label>
                  <input type="text" id="cropQuality" placeholder="e.g. Premium" required>
                </div>
                <div class="input-group" style="grid-column: span 2;">
                  <label for="cropDescription">Description</label>
                  <input type="text" id="cropDescription" placeholder="Freshly harvested..." required>
                </div>
              </div>
              <button type="submit" class="primary-btn" style="margin-top: 15px;">🚀 Publish Crop</button>
            </form>
          </div>
        </div>
        
        <!-- NOTIFICATIONS TAB -->
        <div id="tab-notifications" class="tab-content" style="display: none;">
          <div id="notificationsContainer">
            <h2 class="section-title">🔔 Notifications (Buyer Requests)</h2>
            <div id="notificationsGrid">Loading notifications...</div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
    }
    
    function switchTab(tabId, element) {
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.style.display = 'none';
      });
      // Show selected tab
      document.getElementById('tab-' + tabId).style.display = 'block';
      
      // Update active nav link
      document.querySelectorAll('.nav-item').forEach(nav => {
        nav.classList.remove('active');
      });
      element.classList.add('active');
      
      // Update title
      document.getElementById('pageTitle').innerText = element.innerText.replace(/[^\w\s]/g, '').trim();
    }
  </script>
</body>
</html>
